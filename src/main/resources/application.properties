spring.application.name=bitcoin-traffic-monitor
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bitcoin-monitor;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.task.scheduling.pool.size=2
spring.h2.console.enabled=true
spring.h2.console.path=/dev/h2-console
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
blockchain.api.base-url=${BLOCKCHAIN_API_BASE_URL:https://mempool.space/api}
blockchain.fallback.api-base-url=${BLOCKCHAIN_FALLBACK_API_BASE_URL:https://blockstream.info/api}
blockchain.monitor.interval-ms=${MONITOR_INTERVAL_MS:15000}
blockchain.monitor.max-transactions-per-block=${MAX_TRANSACTIONS_PER_BLOCK:25}
blockchain.monitor.mempool-interval-ms=${MEMPOOL_INTERVAL_MS:30000}
market.coingecko.base-url=${COINGECKO_API_BASE_URL:https://api.coingecko.com/api/v3}
market.alternative-me.base-url=${ALTERNATIVE_ME_BASE_URL:https://api.alternative.me}
market.cache-ttl-ms=${MARKET_CACHE_TTL_MS:60000}
monitoring.retention.days=${RETENTION_DAYS:30}
logging.level.com.bitcoin.monitoring=INFO